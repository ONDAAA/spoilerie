<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shield" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Shield -->
  <path d="M64 20 L100 36 L100 64 C100 88 82 102 64 110 C46 102 28 88 28 64 L28 36 Z"
        fill="url(#shield)" opacity="0.95"/>
  <!-- Eye -->
  <ellipse cx="64" cy="58" rx="16" ry="11" fill="none" stroke="#6366f1" stroke-width="3"/>
  <circle cx="64" cy="58" r="6" fill="#6366f1"/>
  <circle cx="62" cy="56" r="2" fill="#fff" opacity="0.8"/>
  <!-- Slash -->
  <line x1="48" y1="74" x2="80" y2="42" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <!-- Small lock icon at bottom of shield -->
  <rect x="58" y="80" width="12" height="9" rx="2" fill="#6366f1" opacity="0.7"/>
  <path d="M60 80 L60 77 C60 74 62 72 64 72 C66 72 68 74 68 77 L68 80"
        fill="none" stroke="#6366f1" stroke-width="2" opacity="0.7"/>
</svg>
